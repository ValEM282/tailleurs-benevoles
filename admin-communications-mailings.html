<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mailing — Les Tailleurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="subpage-header.css"><link rel="stylesheet" href="admin.css">
<style>body{font-family:"Titillium Web",Arial,sans-serif}.mailings-main{max-width:950px;margin:25px auto;padding:0 16px}.mailings-panel{background:#fff;border:1px solid #dce0ef;border-radius:16px;padding:24px}.mailings-panel h1{color:#1c2eab;margin:0 0 20px}.mailing-choice{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #dce0ef;border-radius:10px;padding:16px;flex-wrap:wrap}.mailing-choice strong{color:#1c2eab;font-size:18px}.mailing-choice p{margin:5px 0 0;color:#555}.mailing-open{background:#1c2eab;color:white;border-radius:8px;padding:10px 18px;text-decoration:none;font-weight:700}.mailing-open:hover{background:#152480}.mailings-note{font-size:14px;color:#555;margin-top:18px}</style></head>
<body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><button id="logout-button" type="button" class="logout-button">Se déconnecter</button></div></header>
<main class="mailings-main"><section class="mailings-panel"><h1>Mailing</h1><div id="mailings-loading" role="status">Vérification des accès…</div><div id="mailings-content" hidden><div class="mailing-choice"><div><strong>Horaires 2026 - 27/09/26</strong><p>Historique des envois d'horaires 2026, statuts individuels et renvois.</p></div><a class="mailing-open" href="admin-envois-horaires.html">Voir les envois</a></div><div id="campaigns-list" style="display:grid;gap:12px;margin-top:14px"></div><p class="mailings-note">Les mailings préparés et envoyés depuis le module Mail apparaissent ici avec leurs résultats individuels.</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script><script>(async()=>{const msg=document.getElementById('mailings-loading');document.getElementById('logout-button').onclick=()=>PortalAuth.logout();const user=await PortalAuth.requireAuth();if(!user)return;const {data,error}=await PortalAuth.client.rpc('is_current_portal_admin');if(error||!data){msg.textContent='Accès réservé aux administrateurs.';return;}msg.hidden=true;document.getElementById('mailings-content').hidden=false;const {data:campaigns,error:campaignError}=await PortalAuth.client.from('mailing_campaigns').select('id,name,subject,status,created_at').order('created_at',{ascending:false});const list=document.getElementById('campaigns-list');if(campaignError){list.textContent='Impossible de charger les mailings : '+campaignError.message;}else{for(const campaign of campaigns||[]){const row=document.createElement('div');row.className='mailing-choice';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=campaign.name;const sub=document.createElement('p');sub.textContent=campaign.subject+' · '+new Date(campaign.created_at).toLocaleString('fr-BE')+' · '+({prepared:'Préparé',sending:'En cours',completed:'Terminé'}[campaign.status]||campaign.status);info.append(title,sub);const link=document.createElement('a');link.className='mailing-open';link.href='admin-communications-mailing-suivi.html?id='+encodeURIComponent(campaign.id);link.textContent='Voir le suivi';row.append(info,link);list.append(row);}}})();</script></body></html>
