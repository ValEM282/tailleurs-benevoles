<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des lieux — Administration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20260921-2">
  <link rel="stylesheet" href="subpage-header.css?v=20260922-2">
  <link rel="stylesheet" href="benevoles-liste.css?v=20260923-7">
  <link rel="stylesheet" href="lieux-liste.css?v=20260924-2">
</head>
<body class="dashboard-page">
  <header class="dashboard-header">
    <div class="subpage-header-inner">
      <a href="admin.html" class="back-button">← Administration</a>
      <div class="dashboard-title">🎪 PORTAIL BÉNÉVOLES 🎪</div>
      <button type="button" id="logout-button" class="logout-button">Se déconnecter</button>
    </div>
  </header>

  <main class="subpage-main volunteers-list-main places-list-main">
    <section class="volunteers-list-heading">
      <h1>Liste des lieux</h1>
      <div class="volunteers-list-actions">
        <p id="lieux-count" class="volunteers-count" aria-live="polite"></p>
        <button type="button" id="print-lieux-button" class="print-list-button" aria-label="Imprimer la liste des lieux" title="Imprimer la liste des lieux">🖨️</button>
      </div>
    </section>

    <div id="lieux-error" class="volunteers-message volunteers-error" hidden></div>

    <section class="volunteers-table-card" aria-labelledby="lieux-table-title">
      <h2 id="lieux-table-title" class="sr-only">Lieux actifs</h2>
      <div class="volunteers-table-scroll">
        <table class="volunteers-table places-table">
          <thead>
            <tr>
              <th scope="col">
                <button type="button" id="lieux-sort-name" class="places-sort-button" aria-label="Trier par Nom du Lieu">
                  Nom du Lieu <span id="lieux-sort-indicator" aria-hidden="true">↑</span>
                </button>
              </th>
            </tr>
          </thead>
          <tbody id="lieux-table-body">
            <tr><td class="volunteers-loading">Chargement de la liste…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal-auth.js"></script>
  <script src="lieux-liste.js?v=20260924-2"></script>
</body>
</html>
