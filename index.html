<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portail Bénévoles des Tailleurs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand">

        <img
          src="assets/T26_Logo_2000px_WHITE.png"
          alt="Les Tailleurs - Festival insolite et insolent"
          class="brand-logo"
        >

        <p>🎪 PORTAIL BÉNÉVOLES 🎪</p>

      </div>

      <form id="login-form">

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="prenom.nom@email.be"
            autocomplete="email"
            required
          >

          <p class="field-help">
            Utilise le même e-mail que celui utilisé lors de ton inscription comme bénévole
          </p>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="primary-button">
          Se connecter
        </button>

      </form>

      <div class="login-links">
        <a href="#" id="forgot-password">
          Mot de passe oublié ?
        </a>
      </div>

      <div class="first-login">

        <p>Première connexion ?</p>

        <button
          type="button"
          id="create-account"
          class="secondary-button"
        >
          Créer mon accès
        </button>

      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
