<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages WhatsApp — Les Tailleurs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="subpage-header.css"><link rel="stylesheet" href="admin.css">
<style>body{font-family:"Titillium Web",Arial,sans-serif}.messages-main{max-width:950px;margin:25px auto;padding:0 16px}.messages-panel{background:#fff;border:1px solid #dce0ef;border-radius:16px;padding:24px}.messages-panel h1{color:#1c2eab;margin:0 0 20px}.message-choice{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #dce0ef;border-radius:10px;padding:16px;flex-wrap:wrap;margin-bottom:12px}.message-choice strong{color:#1c2eab;font-size:18px}.message-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}.message-open{display:inline-block;background:#1c2eab;color:white;border-radius:8px;padding:10px 18px;text-decoration:none;font-weight:700}.message-open:hover{background:#152480}.message-preview{background:#891e82}.message-preview:hover{background:#6d1767}@media(max-width:800px){.message-choice{align-items:stretch}.message-buttons{flex-direction:column;width:100%;margin-left:0}.message-open{text-align:center}}</style></head>
<body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><button id="logout-button" type="button" class="logout-button">Se déconnecter</button></div></header>
<main class="messages-main"><section class="messages-panel"><h1>Messages WhatsApp</h1><div id="loading" role="status">Vérification des accès…</div><div id="content" hidden>
<div class="message-choice"><strong>Invitation responsable</strong><div class="message-buttons"><a class="message-open message-preview" href="admin-communications-whatsapp-preview.html?type=responsable">Voir le message</a><a class="message-open" href="admin-envois-responsables.html">Voir les envois</a></div></div>
<div class="message-choice"><strong>Invitation groupe WhatsApp</strong><div class="message-buttons"><a class="message-open message-preview" href="admin-communications-whatsapp-preview.html?type=groupe">Voir le message</a><a class="message-open" href="admin-envois-groupes-whatsapp.html">Voir les envois</a></div></div>
<div id="custom-messages"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script><script>(async()=>{document.getElementById('logout-button').onclick=()=>PortalAuth.logout();const user=await PortalAuth.requireAuth();if(!user)return;const {data,error}=await PortalAuth.client.rpc('is_current_portal_admin');if(error||!data){document.getElementById('loading').textContent='Accès réservé aux administrateurs.';return;}document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false;const {data:campaigns,error:ce}=await PortalAuth.client.from('whatsapp_message_campaigns').select('id,name,template_date,created_at').order('created_at',{ascending:false});const target=document.getElementById('custom-messages');if(ce){target.textContent='Impossible de charger les messages : '+ce.message;return;}for(const x of campaigns||[]){const row=document.createElement('div');row.className='message-choice';const strong=document.createElement('strong');strong.textContent=x.name+' – '+new Date(x.template_date+'T12:00:00').toLocaleDateString('fr-BE');const actions=document.createElement('div');actions.className='message-buttons';const a=document.createElement('a');a.href='admin-communications-whatsapp-preview.html?id='+encodeURIComponent(x.id);a.className='message-open message-preview';a.textContent='Voir le message';const b=document.createElement('a');b.href='admin-communications-whatsapp-suivi.html?id='+encodeURIComponent(x.id);b.className='message-open';b.textContent='Voir les envois';actions.append(a,b);row.append(strong,actions);target.append(row);}})();</script></body></html>
