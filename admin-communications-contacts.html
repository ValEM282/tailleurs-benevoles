<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liste des contacts — Communications — ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="subpage-header.css">
<style>
.contacts-main{max-width:1100px;margin:25px auto;padding:0 15px;font-family:"Titillium Web",sans-serif}.contacts-card{background:white;border:1px solid #dce0ef;border-radius:16px;padding:22px;margin-bottom:15px;box-shadow:0 5px 18px #1c2eab12}.contacts-card h1{color:#1c2eab;margin:0}.contacts-lead{margin:7px 0 16px}.contacts-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.contacts-filters label{font-weight:700;color:#1c2eab;display:block}.contacts-filters input,.contacts-filters select{width:100%;padding:11px;border:1px solid #d3d8e8;border-radius:9px;box-sizing:border-box;font:inherit}.contacts-total{font-weight:700;color:#891e82;margin:14px 0}.contacts-table-wrap{overflow-x:auto}.contacts-table{border-collapse:collapse;width:100%}.contacts-table th,.contacts-table td{padding:10px;border-bottom:1px solid #e5e7f0;text-align:left}.contacts-table th{color:#1c2eab}.contacts-table td{overflow-wrap:anywhere}.contacts-status{font-size:.85rem}.contacts-error{color:#e40230}.contacts-muted{color:#666}.contacts-back{display:inline-block;margin-bottom:12px;color:#1c2eab;font-weight:700}.contacts-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.contacts-actions button{padding:9px 16px;background:#1c2eab;color:white;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.contacts-actions button:disabled{opacity:.5}@media(max-width:700px){.contacts-filters{grid-template-columns:1fr}.contacts-card{padding:15px}.contacts-table{font-size:.86rem}}
.multi-filter{position:relative;border:1px solid #d3d8e8;border-radius:9px;background:white}.multi-filter summary{padding:11px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:6px}.multi-filter summary:after{content:"⌄"}.multi-filter[open]{z-index:10}.multi-options{position:absolute;top:100%;left:0;right:0;max-height:270px;overflow:auto;background:#fff;border:1px solid #d3d8e8;border-radius:9px;box-shadow:0 7px 20px #1c2eab22;padding:8px;min-width:220px}.multi-options label{display:flex;gap:8px;align-items:center;padding:5px 3px;color:#222;font-weight:400}.multi-options input{width:auto;margin:0;accent-color:#1c2eab}.contacts-table{min-width:850px}.contacts-table td{vertical-align:top}.contacts-filters .filter-box>label{margin-bottom:0}.contacts-table td:nth-child(5){min-width:175px}.contacts-sort{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:#1c2eab;font:inherit;font-weight:700;cursor:pointer;text-align:left}.contacts-sort:hover{text-decoration:underline}.contacts-sort:focus-visible{outline:2px solid #e40230;outline-offset:3px}.sort-indicator{font-size:.85em;color:#891e82}.contacts-table th[aria-sort="ascending"] .sort-indicator,.contacts-table th[aria-sort="descending"] .sort-indicator{color:#1c2eab}.contacts-select-cell{width:42px;min-width:42px;text-align:center}.contacts-select-cell input{width:18px;height:18px;accent-color:#1c2eab}.contacts-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#contacts-create-list{background:#1c2eab;color:#fff;border:0;border-radius:8px;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}#contacts-create-list:hover{background:#12217f}</style></head><body class="dashboard-page">
<header class="dashboard-header"><div class="subpage-header-inner"><a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><button type="button" id="logout-button" class="logout-button">Se déconnecter</button></div></header>
<main class="contacts-main"><section class="contacts-card"><h1>Liste des contacts</h1>
<div id="contacts-message" role="status">Vérification des droits d'accès…</div>
<div id="contacts-content" hidden>
<div class="contacts-filters"><div><label for="contact-search">NOM - Prénom - Email</label><input id="contact-search" placeholder="" type="search"></div><div class="filter-box"><label>Année</label><details id="filter-edition" class="multi-filter"><summary>Tout</summary><div class="multi-options" id="options-edition"></div></details></div><div class="filter-box"><label>Rôle</label><details id="filter-role" class="multi-filter"><summary>Tout</summary><div class="multi-options" id="options-role"></div></details></div><div class="filter-box"><label>Poste</label><details id="filter-post" class="multi-filter"><summary>Tout</summary><div class="multi-options" id="options-post"></div></details></div><div class="filter-box"><label>Statut</label><details id="filter-status" class="multi-filter"><summary>Tout</summary><div class="multi-options" id="options-status"></div></details></div><div class="filter-box"><label>Source</label><details id="filter-source" class="multi-filter"><summary>Tout</summary><div class="multi-options" id="options-source"></div></details></div></div>
<p class="contacts-total" id="contacts-count"></p><div class="contacts-actions"><button id="contacts-create-list" type="button">Créer une liste (0)</button><button id="contacts-export" type="button">Exporter la sélection (.csv)</button></div>
<div class="contacts-table-wrap"><table class="contacts-table"><thead><tr><th class="contacts-select-cell"><input id="contacts-select-all" type="checkbox" aria-label="Sélectionner tous les contacts filtrés" title="Sélectionner tous les contacts filtrés"></th><th><button type="button" class="contacts-sort" data-sort="0" aria-label="Trier Nom de A à Z">Nom<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th><button type="button" class="contacts-sort" data-sort="1" aria-label="Trier Prénom de A à Z">Prénom<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th><button type="button" class="contacts-sort" data-sort="2" aria-label="Trier Email de A à Z">Email<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th><button type="button" class="contacts-sort" data-sort="3" aria-label="Trier Rôle de A à Z">Rôle<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th><button type="button" class="contacts-sort" data-sort="4" aria-label="Trier Poste de A à Z">Poste<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th><button type="button" class="contacts-sort" data-sort="5" aria-label="Trier Année de A à Z">Année<span class="sort-indicator" aria-hidden="true">↕</span></button></th><th><button type="button" class="contacts-sort" data-sort="6" aria-label="Trier Statut de A à Z">Statut<span class="sort-indicator" aria-hidden="true">↕</span></button></th></tr></thead><tbody id="contacts-body"></tbody></table></div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script><script src="admin-communications-contacts.js?v=20261018-status"></script>
</body></html>
