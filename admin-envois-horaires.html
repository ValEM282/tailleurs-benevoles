<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Envois des horaires — Portail Bénévoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260921-2"><link rel="stylesheet" href="subpage-header.css?v=20260922-2"><link rel="stylesheet" href="admin.css?v=20260927-3">
<style>
.mail-status-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}.mail-status-box{padding:12px;border-radius:10px;background:#f4f5fb;text-align:center}.mail-status-box strong{display:block;font-size:1.5rem;color:#1C2EAB}.mail-status-list{display:grid;gap:8px}.mail-status-row{display:grid;grid-template-columns:minmax(160px,1.3fr) minmax(190px,1.5fr) minmax(105px,.7fr) minmax(145px,1fr);gap:10px;align-items:center;padding:11px 12px;border:1px solid #dde1ed;border-radius:10px;background:#fff}.mail-status-name{font-weight:700}.mail-status-email{overflow-wrap:anywhere}.mail-status-pill{font-weight:700}.mail-status-pill.envoye{color:#168344}.mail-status-pill.a_envoyer{color:#1C2EAB}.mail-status-pill.erreur{color:#E40230}@media(max-width:700px){.mail-status-summary{grid-template-columns:1fr}.mail-status-row{grid-template-columns:1fr;gap:2px}.mail-status-date{color:#5f6884}}
</style></head>
<body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner">
<a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><span></span>
</div></header>
<main class="subpage-main admin-main"><section class="admin-card">
<h1 style="color:#1C2EAB;margin-top:0">SUIVI DES MAILS</h1>

<div id="mail-loading" class="admin-message">Chargement…</div>
<div id="mail-content" hidden><div class="mail-status-summary">
<div class="mail-status-box"><strong id="count-sent">0</strong>Envoyés</div>
<div class="mail-status-box"><strong id="count-pending">0</strong>À envoyer</div>
<div class="mail-status-box"><strong id="count-errors">0</strong>Erreurs</div>
</div><div id="mail-list" class="mail-status-list"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script>
<script>
(async()=>{
 const loading=document.getElementById("mail-loading"),content=document.getElementById("mail-content"),list=document.getElementById("mail-list");
 const user=await PortalAuth.requireAuth();if(!user)return;
 const {data:isAdmin,error:ae}=await PortalAuth.client.rpc("is_current_portal_admin");if(ae||!isAdmin){loading.textContent="Cette page est réservée aux administrateurs.";return}
 const {data,error}=await PortalAuth.client.rpc("admin_mailing_horaires_status");if(error){console.error(error);loading.textContent="Impossible de charger le suivi des envois.";return}
 const rows=data||[],sent=rows.filter(x=>x.statut==="envoye").length,pending=rows.filter(x=>x.statut==="a_envoyer").length,errors=rows.filter(x=>x.statut==="erreur").length;
 document.getElementById("count-sent").textContent=sent;document.getElementById("count-pending").textContent=pending;document.getElementById("count-errors").textContent=errors;
 const fmt=d=>d?new Intl.DateTimeFormat("fr-BE",{timeZone:"Europe/Brussels",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(d)):"—";
 const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
 for(const r of rows){const row=document.createElement("div");row.className="mail-status-row";const label=r.statut==="envoye"?"Envoyé":r.statut==="erreur"?"Erreur":"À envoyer";row.innerHTML='<div class="mail-status-name">'+esc(r.prenom)+" "+esc(r.nom)+'</div><div class="mail-status-email">'+esc(r.email)+'</div><div class="mail-status-pill '+esc(r.statut)+'">'+label+'</div><div class="mail-status-date">'+(r.statut==="envoye"?fmt(r.envoye_at):r.statut==="erreur"?esc(r.erreur||"Erreur d’envoi"):"—")+'</div>';list.appendChild(row)}
 loading.hidden=true;content.hidden=false;
})();
</script></body></html>
