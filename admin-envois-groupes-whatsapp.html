<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260921-2"><link rel="stylesheet" href="subpage-header.css?v=20260922-2"><link rel="stylesheet" href="admin.css?v=20260927-3">
<style>
.mail-status-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}.mail-status-box{padding:12px;border-radius:10px;background:#f4f5fb;text-align:center}.mail-status-box strong{display:block;font-size:1.5rem;color:#1C2EAB}.mail-status-list{display:grid;gap:8px}.mail-status-row{display:grid;grid-template-columns:minmax(115px,1fr) minmax(120px,1fr) minmax(180px,1.5fr) minmax(100px,.75fr) minmax(155px,1.1fr) 44px;gap:10px;align-items:center;padding:11px 12px;border:1px solid #dde1ed;border-radius:10px;background:#fff}.mail-status-name{font-weight:700}.mail-status-header{display:grid;grid-template-columns:minmax(115px,1fr) minmax(120px,1fr) minmax(180px,1.5fr) minmax(100px,.75fr) minmax(155px,1.1fr) 44px;gap:10px;align-items:center;padding:0 12px 8px;color:#1c2eab;font-weight:700}.mail-status-sort{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;font-weight:700;cursor:pointer}.mail-status-sort:hover{text-decoration:underline}.mail-status-sort:focus-visible{outline:2px solid #891e82;outline-offset:3px}.mail-status-sort .sort-indicator{margin-left:5px;font-weight:400}.mail-status-header .mail-status-date-title{white-space:nowrap}.mail-status-email{overflow-wrap:anywhere}.mail-status-pill{font-weight:700}.mail-status-pill.envoye{color:#168344}.mail-status-pill.a_envoyer{color:#1C2EAB}.mail-status-pill.erreur{color:#E40230}.mail-resend{width:38px;height:38px;border:2px solid #168344;border-radius:50%;background:#168344;color:#fff;font-size:23px;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:Arial,sans-serif}.mail-resend:hover{filter:brightness(.92)}.mail-resend:disabled{opacity:.55;cursor:wait}.mail-status-feedback{grid-column:1/-1;color:#168344;font-weight:600;font-size:.95rem}.mail-status-feedback.error{color:#E40230}.mail-last-error{grid-column:1/-1;color:#E40230;font-weight:700;font-size:.95rem;padding-top:2px}@media(max-width:700px){.mail-status-summary{grid-template-columns:1fr}.mail-status-row{grid-template-columns:1fr auto;gap:3px 8px}.mail-status-name,.mail-status-firstname,.mail-status-email,.mail-status-pill,.mail-status-date{grid-column:1}.mail-resend{grid-column:2;grid-row:1/5;align-self:center}.mail-status-date{color:#5f6884}.mail-status-header{grid-template-columns:1fr 1fr;gap:4px 10px;padding:8px 12px}.mail-status-header .mail-status-sort,.mail-status-header .mail-status-date-title{grid-column:auto}.mail-status-header .mail-status-date-title{grid-column:1/-1}.mail-status-header .mail-status-sort{font-size:.9rem}.mail-status-header .mail-status-sort:nth-child(3){grid-column:1}.mail-status-header .mail-status-sort:nth-child(4){grid-column:2}}

.mail-status-sort[aria-sort="ascending"],.mail-status-sort[aria-sort="descending"]{text-decoration:none}
.mail-status-date{white-space:nowrap}.mail-status-row .mail-resend:disabled{background:#aeb3be;border-color:#aeb3be;opacity:.85;cursor:not-allowed}
.mail-status-row .mail-status-email{min-width:0}
@media(max-width:700px){.mail-status-date{white-space:normal}.mail-status-row .mail-resend{grid-row:1/6}}
</style></head><body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><span></span></div></header>
<main class="subpage-main admin-main"><section class="admin-card">
<a href="admin-communications-whatsapp-messages.html" style="display:inline-block;margin-bottom:12px;color:#1c2eab;text-decoration:none;font-weight:700">← Messages WhatsApp</a><h1 style="color:#1C2EAB;margin-top:0">Invitation groupe WhatsApp</h1>
<div id="mail-loading" class="admin-message">Chargement…</div>
<div id="mail-content" hidden><div class="mail-status-summary"><div class="mail-status-box"><strong id="count-sent">0</strong>Envoyés</div><div class="mail-status-box"><strong id="count-pending">0</strong>À envoyer</div><div class="mail-status-box"><strong id="count-errors">0</strong>Erreurs</div></div>
<div class="mail-status-header" aria-label="Colonnes et tri des envois"><button class="mail-status-sort" data-sort="prenom" type="button">Prénom<span class="sort-indicator"></span></button><button class="mail-status-sort" data-sort="nom" type="button">NOM<span class="sort-indicator"></span></button><button class="mail-status-sort" data-sort="email" type="button">Email<span class="sort-indicator"></span></button><button class="mail-status-sort" data-sort="statut" type="button">Statut<span class="sort-indicator"></span></button><button class="mail-status-sort mail-status-date-title" data-sort="date" type="button">Date d’envoi<span class="sort-indicator"></span></button><span></span></div>
<div id="mail-list" class="mail-status-list"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script>
<script>(async()=>{
 const loading=document.getElementById("mail-loading"),content=document.getElementById("mail-content"),list=document.getElementById("mail-list");
 const user=await PortalAuth.requireAuth();if(!user)return;
 const {data:isAdmin,error:adminError}=await PortalAuth.client.rpc("is_current_portal_admin");
 if(adminError||!isAdmin){loading.textContent="Cette page est réservée aux administrateurs.";return}
 const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
 const fmt=d=>d?new Intl.DateTimeFormat("fr-BE",{timeZone:"Europe/Brussels",day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(d)).replace(",",""):"—";
 const normalizePhone=p=>{let s=String(p||"").replace(/[^0-9+]/g,"");if(s.startsWith("00"))s="+"+s.slice(2);if(s.startsWith("0"))s="+32"+s.slice(1);return s.replace("+","")};
 const collator=new Intl.Collator("fr",{sensitivity:"base",numeric:true});
 let sortKey=null,sortDirection=1;
 try{
 
 const [{data:people,error:peopleError},{data:logData,error:logError},{data:volData,error:volError}]=await Promise.all([
  PortalAuth.client.rpc("admin_list_whatsapp_group_invitation_candidates"),
  PortalAuth.client.rpc("admin_list_whatsapp_group_invitation_logs"),
  PortalAuth.client.rpc("admin_list_benevoles")
 ]);
 if(peopleError||logError)throw peopleError||logError;
 const rows=Array.isArray(people)?people:[];
 const logs=new Map((logData||[]).map(x=>[String(x.benevole_id),x]));
 const emails=new Map((volData||[]).map(x=>[String(x.id||x.benevole_id||x.personne_id),x.email||x.mail||""]));
 const keyOf=r=>String(r.id);
 const emailOf=r=>r.email||r.mail||emails.get(keyOf(r))||"";
 const phoneOf=r=>r.telephone||r.phone||r.gsm||r.mobile||"";
 const message=r=>`Bonjour ${r.prenom||""},

Pour faciliter la communication entre nous pendant le festival, je t’invite à consulter le Portail Bénévoles des Tailleurs :
https://benevoles.lestailleurs.be/

Une fois connecté·e, clique sur le bouton « 💬 WhatsApp » et rejoins le ou les groupes qui te concernent.

Merci de contribuer ainsi à améliorer la communication entre tous les acteurs du festival Les Tailleurs. 🎪

À très vite !`;
 const logFunction="admin_log_whatsapp_group_invitation";
 
 const rowStatus=r=>logs.has(keyOf(r))?"envoye":"a_envoyer";
 const comparator=(a,b)=>{
  const value=r=>sortKey==="statut"?rowStatus(r):sortKey==="date"?(logs.get(keyOf(r))?.premier_envoi_at||""):sortKey==="email"?emailOf(r):r[sortKey]||"";
  return collator.compare(String(value(a)),String(value(b)))*sortDirection;
 };
 document.querySelectorAll(".mail-status-sort").forEach(button=>button.addEventListener("click",()=>{
   const key=button.dataset.sort;
   if(sortKey===key)sortDirection*=-1;else{sortKey=key;sortDirection=1}
   document.querySelectorAll(".mail-status-sort").forEach(b=>{
    const active=b.dataset.sort===sortKey;b.querySelector(".sort-indicator").textContent=active?(sortDirection===1?" ↑":" ↓"):"";
    b.setAttribute("aria-sort",active?(sortDirection===1?"ascending":"descending"):"none");
   });
   render();
 }));
 function render(){
  const sent=rows.filter(r=>logs.has(keyOf(r))).length;
  document.getElementById("count-sent").textContent=sent;
  document.getElementById("count-pending").textContent=rows.length-sent;
  document.getElementById("count-errors").textContent="0";
  list.replaceChildren();
  const sorted=sortKey?[...rows].sort(comparator):rows;
  for(const r of sorted){
   const key=keyOf(r),log=logs.get(key),count=Number(log?.nombre_envois||0),phone=normalizePhone(phoneOf(r)),email=emailOf(r);
   const row=document.createElement("div");row.className="mail-status-row";
   row.innerHTML='<div class="mail-status-firstname">'+esc(r.prenom)+'</div><div class="mail-status-name">'+esc(r.nom)+'</div><div class="mail-status-email">'+esc(email||"—")+'</div><div class="mail-status-pill '+(log?"envoye":"a_envoyer")+'">'+(log?"Envoyé":"À envoyer")+'</div><div class="mail-status-date">'+(log?esc(fmt(log.premier_envoi_at))+' (1er)'+(count>1?' · '+count+' envois':''):"—")+'</div><button type="button" class="mail-resend" title="'+(log?"Renvoyer via WhatsApp":"Envoyer via WhatsApp")+'" aria-label="'+(log?"Renvoyer via WhatsApp":"Envoyer via WhatsApp")+'" '+(phone?'':'disabled')+'>↻</button>';
   const button=row.querySelector(".mail-resend");
   if(phone)button.addEventListener("click",async()=>{
    if(!confirm((log?"Renvoyer":"Envoyer")+" l’invitation WhatsApp à "+(r.prenom||"")+" "+(r.nom||"")+" ?"))return;
    // Open synchronously to avoid popup blocking after Supabase RPC.
    const popup=window.open("about:blank","_blank");
    button.disabled=true;
    try{
      const {data:logged,error}=await PortalAuth.client.rpc(logFunction,{p_benevole_id:key});
      if(error)throw error;
      const updated=Array.isArray(logged)?logged[0]:logged;
      if(updated)logs.set(key,{benevole_id:key,...updated});
      const url="https://wa.me/"+phone+"?text="+encodeURIComponent(message(r));
      if(popup)popup.location.href=url;else window.location.href=url;
      render();
    }catch(error){
      console.error(error);if(popup)popup.close();button.disabled=false;
      alert("Impossible d’enregistrer l’envoi WhatsApp.");
    }
   });
   list.appendChild(row);
  }
  loading.hidden=true;content.hidden=false;
 }
 render();
 }catch(error){console.error(error);loading.textContent="Impossible de charger les destinataires WhatsApp.";}
})();</script></body></html>
