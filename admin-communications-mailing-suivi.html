<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi du mailing — Les Tailleurs</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="subpage-header.css"><link rel="stylesheet" href="admin.css"><link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:"Titillium Web",Arial,sans-serif}.mailing-main{max-width:1050px;margin:25px auto;padding:0 16px}.mailing-panel{background:white;border:1px solid #dce0ef;border-radius:16px;padding:22px}.mailing-panel h1{color:#1c2eab}.mailing-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.mailing-stat{padding:12px;background:#f4f5fb;border-radius:10px;text-align:center}.mailing-stat strong{display:block;font-size:25px;color:#1c2eab}.mailing-actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.mailing-actions button,.mailing-row button{background:#1c2eab;color:white;border:0;border-radius:8px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.mailing-actions button:disabled,.mailing-row button:disabled{opacity:.5;cursor:not-allowed}#stop-send{background:#e40230}.mailing-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(190px,1.4fr) minmax(95px,.7fr) minmax(145px,1fr) auto;align-items:center;gap:10px;padding:12px;border:1px solid #e1e5ef;border-radius:9px;margin:7px 0}.mailing-row span{overflow-wrap:anywhere}.mailing-row .sent{color:#168344}.mailing-row .error{color:#e40230}.mailing-row .pending{color:#1c2eab}.mailing-row .excluded{color:#891e82}.mailing-row small{grid-column:1/-1;color:#e40230}.mailing-info{color:#555;font-size:14px}#mailing-feedback{color:#1c2eab;font-weight:600}.mailing-back{color:#1c2eab;text-decoration:none;font-weight:700}@media(max-width:700px){.mailing-stats{grid-template-columns:repeat(2,1fr)}.mailing-row{grid-template-columns:1fr auto}.mailing-row span{grid-column:1}.mailing-row button{grid-column:2;grid-row:1/5}}</style></head><body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a class="back-button" href="admin.html">← Accueil ADMIN</a><a class="dashboard-title" href="dashboard.html" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><button id="logout-button" class="logout-button">Se déconnecter</button></div></header><main class="mailing-main"><section class="mailing-panel"><a href="admin-communications-mailings.html" class="mailing-back">← Mailing</a><h1 id="campaign-title">Suivi du mailing</h1><div id="campaign-loading">Chargement…</div><div id="campaign-content" hidden><p id="campaign-subject"></p><p id="campaign-created" class="mailing-info"></p><div class="mailing-stats"><div class="mailing-stat"><strong id="stat-sent">0</strong>Envoyés</div><div class="mailing-stat"><strong id="stat-pending">0</strong>À envoyer</div><div class="mailing-stat"><strong id="stat-errors">0</strong>Erreurs</div><div class="mailing-stat"><strong id="stat-excluded">0</strong>Exclus</div></div><div class="mailing-actions"><button id="start-send" type="button">Lancer les envois</button><button id="stop-send" type="button" hidden>Arrêter après ce mail</button><button id="refresh-send" type="button">Actualiser</button></div><p id="mailing-feedback" role="status"></p><div id="mailing-list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script><script src="admin-communications-mailing-suivi.js?v=20261018-2"></script></body></html>
