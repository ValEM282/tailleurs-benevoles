<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horaires vacants — Administration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20260921-2">
  <link rel="stylesheet" href="subpage-header.css?v=20260922-2">
  <link rel="stylesheet" href="admin-horaires-completer.css?v=20260925-1">
  <style>
    .open-shifts-filters {
      position: relative;
      z-index: 100;
      overflow: visible;
    }
    .open-filter-field {
      position: relative;
      z-index: 101;
    }
    .open-shifts-list,
    .open-shifts-message {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body class="dashboard-page">
  <header class="dashboard-header">
    <div class="subpage-header-inner">
      <a href="admin.html" class="back-button">← Accueil ADMIN</a>
      <div class="dashboard-title">🎪 PORTAIL BÉNÉVOLES 🎪</div>
      <button type="button" id="logout-button" class="logout-button">Se déconnecter</button>
    </div>
  </header>

  <main class="subpage-main open-shifts-main">
    <section class="open-shifts-heading">
      <div>
        <h1>HORAIRES VACANTS</h1>
      </div>
    </section>

    <section class="open-shifts-filters" aria-label="Filtres">
      <div class="open-filter-field">
        <label for="open-day-filter">Jour</label>
        <select id="open-day-filter">
          <option value="">Tous les jours</option>
        </select>
      </div>
      <div class="open-filter-field">
        <label for="open-post-filter">Poste</label>
        <select id="open-post-filter">
          <option value="">Tous les postes</option>
        </select>
      </div>
    </section>

    <div hidden aria-hidden="true">
      <span id="open-summary-places">0</span>
      <span id="open-summary-posts">0</span>
      <span id="open-summary-hours">0</span>
    </div>

    <div id="open-shifts-loading" class="open-shifts-message">Chargement des créneaux à pourvoir…</div>
    <div id="open-shifts-error" class="open-shifts-message open-shifts-error" hidden></div>
    <div id="open-shifts-list" class="open-shifts-list" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal-auth.js"></script>
  <script src="admin-horaires-completer.js?v=20260925-3"></script>
</body>
</html>
