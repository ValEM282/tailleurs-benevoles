<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Envois responsables — Portail Bénévoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260921-2"><link rel="stylesheet" href="subpage-header.css?v=20260922-2"><link rel="stylesheet" href="admin.css?v=20260927-3">
<style>
.mail-status-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}.mail-status-box{padding:12px;border-radius:10px;background:#f4f5fb;text-align:center}.mail-status-box strong{display:block;font-size:1.5rem;color:#1C2EAB}.mail-status-list{display:grid;gap:8px}.mail-status-row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(190px,1.4fr) minmax(170px,1.2fr) minmax(150px,1fr);gap:10px;align-items:center;padding:11px 12px;border:1px solid #dde1ed;border-radius:10px;background:#fff}.mail-status-name{font-weight:700}.mail-status-email{overflow-wrap:anywhere}.mail-status-pill{font-weight:700}.mail-status-pill.envoye{color:#168344}.mail-status-pill.a_envoyer{color:#1C2EAB}.mail-status-pill.deja_connecte,.mail-status-pill.horaires{color:#5f6884}.mail-status-pill.erreur{color:#E40230}@media(max-width:760px){.mail-status-summary{grid-template-columns:1fr 1fr}.mail-status-row{grid-template-columns:1fr}.mail-status-date{color:#5f6884}}
</style></head><body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><span></span></div></header>
<main class="subpage-main admin-main"><section class="admin-card"><h1 style="color:#1C2EAB;margin-top:0">SUIVI DES INVITATIONS RESPONSABLES</h1>
<div id="mail-loading" class="admin-message">Chargement…</div><div id="mail-content" hidden><div class="mail-status-summary">
<div class="mail-status-box"><strong id="count-sent">0</strong>Envoyées</div><div class="mail-status-box"><strong id="count-pending">0</strong>À envoyer</div><div class="mail-status-box"><strong id="count-connected">0</strong>Déjà connecté·e·s</div><div class="mail-status-box"><strong id="count-schedules">0</strong>Invitation et horaires déjà envoyés</div>
</div><div id="mail-list" class="mail-status-list"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script>
<script>
(async()=>{const loading=document.getElementById("mail-loading"),content=document.getElementById("mail-content"),list=document.getElementById("mail-list");const user=await PortalAuth.requireAuth();if(!user)return;const {data:isAdmin,error:ae}=await PortalAuth.client.rpc("is_current_portal_admin");if(ae||!isAdmin){loading.textContent="Cette page est réservée aux administrateurs.";return}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const fmt=d=>d?new Intl.DateTimeFormat("fr-BE",{timeZone:"Europe/Brussels",day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(d)).replace(",",""):"—";
const {data,error}=await PortalAuth.client.rpc("admin_mailing_responsables_status");if(error){console.error(error);loading.textContent="Le suivi sera disponible dès l’activation de l’envoi des invitations.";return}
const rows=data||[];const val=(x,...k)=>k.map(y=>x[y]).find(y=>y!==undefined&&y!==null);let sent=0,pending=0,connected=0,schedules=0;list.innerHTML="";
for(const r of rows){let s=String(val(r,"statut","status")||"a_envoyer");if(s==="envoye")sent++;else if(s==="deja_connecte")connected++;else if(s==="invitation_horaires_envoyes")schedules++;else pending++;
let label=s==="envoye"?"Envoyée":s==="deja_connecte"?"Déjà connecté·e":s==="invitation_horaires_envoyes"?"Invitation et horaires déjà envoyés":s==="erreur"?"Erreur":"À envoyer";
let row=document.createElement("div");row.className="mail-status-row";row.innerHTML='<div class="mail-status-name">'+esc(val(r,"prenom")||"")+" "+esc(val(r,"nom")||"")+'</div><div class="mail-status-email">'+esc(val(r,"email")||"")+'</div><div>'+esc(val(r,"role_et_affectation","role_affectation","role")||"")+'</div><div><span class="mail-status-pill '+esc(s)+'">'+label+'</span><div class="mail-status-date">'+fmt(val(r,"envoye_at","sent_at"))+'</div></div>';list.appendChild(row)}
document.getElementById("count-sent").textContent=sent;document.getElementById("count-pending").textContent=pending;document.getElementById("count-connected").textContent=connected;document.getElementById("count-schedules").textContent=schedules;loading.hidden=true;content.hidden=false;
})();</script></body></html>
