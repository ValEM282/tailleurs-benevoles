<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Envois responsables — Portail Bénévoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260921-2"><link rel="stylesheet" href="subpage-header.css?v=20260922-2"><link rel="stylesheet" href="admin.css?v=20260927-3">
<style>
.mail-status-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}.mail-status-box{padding:12px;border-radius:10px;background:#f4f5fb;text-align:center}.mail-status-box strong{display:block;font-size:1.5rem;color:#1C2EAB}.mail-status-list{display:grid;gap:8px}.mail-status-row{display:grid;grid-template-columns:34px minmax(150px,1.1fr) minmax(190px,1.4fr) minmax(170px,1.2fr) minmax(150px,1fr);gap:10px;align-items:center;padding:11px 12px;border:1px solid #dde1ed;border-radius:10px;background:#fff}.mail-status-name{font-weight:700}.mail-select{width:18px;height:18px;accent-color:#168344}.mail-selection-actions{margin-top:18px;padding-top:16px;border-top:1px solid #dfe3f5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.mail-selection-count{font-weight:700;color:#1C2EAB}.mail-send-selected{border:0;border-radius:8px;padding:11px 18px;background:#168344;color:#fff;font:700 1rem "Titillium Web",sans-serif;cursor:pointer}.mail-send-selected:disabled{opacity:.45;cursor:not-allowed}.mail-status-email{overflow-wrap:anywhere}.mail-status-pill{font-weight:700}.mail-status-pill.envoye{color:#168344}.mail-status-pill.a_envoyer{color:#1C2EAB}.mail-status-pill.deja_connecte,.mail-status-pill.horaires{color:#5f6884}.mail-status-pill.erreur{color:#E40230}@media(max-width:760px){.mail-status-summary{grid-template-columns:1fr 1fr}.mail-status-row{grid-template-columns:1fr}.mail-status-date{color:#5f6884}}
</style></head><body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a href="admin.html" class="back-button">← Accueil ADMIN</a><a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><span></span></div></header>
<main class="subpage-main admin-main"><section class="admin-card"><h1 style="color:#1C2EAB;margin-top:0">SUIVI DES INVITATIONS RESPONSABLES</h1>
<div id="mail-loading" class="admin-message">Chargement…</div><div id="mail-content" hidden><div class="mail-status-summary">
<div class="mail-status-box"><strong id="count-sent">0</strong>Envoyées</div><div class="mail-status-box"><strong id="count-pending">0</strong>À envoyer</div><div class="mail-status-box"><strong id="count-connected">0</strong>Déjà connecté·e·s</div><div class="mail-status-box"><strong id="count-schedules">0</strong>Invitation et horaires déjà envoyés</div>
</div><div id="mail-list" class="mail-status-list"></div><div class="mail-selection-actions"><span id="selection-count" class="mail-selection-count">0 invitation sélectionnée</span><button id="send-selected" type="button" class="mail-send-selected" disabled>Envoyer les invitations sélectionnées</button></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script>
<script>
(async()=>{const loading=document.getElementById("mail-loading"),content=document.getElementById("mail-content"),list=document.getElementById("mail-list");const user=await PortalAuth.requireAuth();if(!user)return;const {data:isAdmin,error:ae}=await PortalAuth.client.rpc("is_current_portal_admin");if(ae||!isAdmin){loading.textContent="Cette page est réservée aux administrateurs.";return}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const fmt=d=>d?new Intl.DateTimeFormat("fr-BE",{timeZone:"Europe/Brussels",day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(d)).replace(",",""):"—";
const {data,error}=await PortalAuth.client.rpc("admin_mailing_responsables_status");if(error){console.error(error);loading.textContent="Le suivi sera disponible dès l’activation de l’envoi des invitations.";return}
const rows=data||[];const selected=new Set();const countEl=document.getElementById("selection-count"),sendBtn=document.getElementById("send-selected");const updateSelection=()=>{const n=selected.size;countEl.textContent=n+" invitation"+(n>1?"s":"")+" sélectionnée"+(n>1?"s":"");sendBtn.disabled=n===0};const val=(x,...k)=>k.map(y=>x[y]).find(y=>y!==undefined&&y!==null);let sent=0,pending=0,connected=0,schedules=0;list.innerHTML="";
for(const r of rows){let s=String(val(r,"statut","status")||"a_envoyer");if(s==="envoye")sent++;else if(s==="deja_connecte")connected++;else if(s==="invitation_horaires_envoyes")schedules++;else pending++;
let label=s==="envoye"?"Envoyée":s==="deja_connecte"?"Déjà connecté·e":s==="invitation_horaires_envoyes"?"Invitation et horaires déjà envoyés":s==="erreur"?"Erreur":"À envoyer";
let row=document.createElement("div");row.className="mail-status-row";const selectable=s==="a_envoyer";if(selectable)selected.add(r.benevole_id);row.innerHTML='<div><input class="mail-select" type="checkbox" '+(selectable?'checked':'disabled')+' aria-label="Sélectionner '+esc((r.prenom||"")+" "+(r.nom||""))+'"></div><div class="mail-status-name">'+esc(val(r,"prenom")||"")+" "+esc(val(r,"nom")||"")+'</div><div class="mail-status-email">'+esc(val(r,"email")||"")+'</div><div>'+esc(val(r,"role_et_affectation","role_affectation","role")||"")+'</div><div><span class="mail-status-pill '+esc(s)+'">'+label+'</span><div class="mail-status-date">'+fmt(val(r,"envoye_at","sent_at"))+'</div></div>';const cb=row.querySelector(".mail-select");if(selectable)cb.addEventListener("change",()=>{if(cb.checked)selected.add(r.benevole_id);else selected.delete(r.benevole_id);updateSelection()});list.appendChild(row)}
updateSelection();sendBtn.addEventListener("click",()=>{const n=selected.size;if(!n)return;window.alert("Sélection enregistrée : "+n+" invitation"+(n>1?"s":"")+".\n\nAucun mail n’est encore envoyé : l’envoi réel sera activé après ta validation finale de cette liste.");});
document.getElementById("count-sent").textContent=sent;document.getElementById("count-pending").textContent=pending;document.getElementById("count-connected").textContent=connected;document.getElementById("count-schedules").textContent=schedules;loading.hidden=true;content.hidden=false;
})();</script></body></html>
