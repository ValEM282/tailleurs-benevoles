<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp — Les Tailleurs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="subpage-header.css"><link rel="stylesheet" href="admin.css"><style>body{font-family:"Titillium Web",Arial,sans-serif}.main{max-width:980px;margin:25px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce0ef;border-radius:16px;padding:24px}.panel h1{color:#1c2eab;margin:0 0 20px}label{display:block;font-weight:700;color:#1c2eab;margin-bottom:5px}.field{margin-bottom:14px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd3e7;border-radius:8px;font:inherit}textarea{min-height:180px}.template-line{display:flex;align-items:center;gap:8px}.template-line select{flex:1;min-width:0}.icon-btn{width:38px;height:38px;flex:0 0 38px;border-radius:9px;background:#fff;border:2px solid #1c2eab;color:#1c2eab;font-size:22px;cursor:pointer}.icon-btn.add{border-radius:50%;border-color:#2e9d57;color:#2e9d57}.icon-btn.delete{border-color:#e40230;color:#e40230}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;color:white;background:#1c2eab;padding:11px 16px;border-radius:8px;font:700 1rem "Titillium Web",sans-serif;cursor:pointer}.btn.purple{background:#891e82}.btn.red{background:#e40230}.btn:disabled{opacity:.55;cursor:wait}.preview{background:#edf0f3;padding:20px;border-radius:12px}.bubble{background:#dcf8c6;white-space:pre-wrap;overflow-wrap:anywhere;max-width:500px;margin-left:auto;padding:15px;border-radius:12px 12px 3px 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.toolbar button{padding:6px 12px;border:1px solid #cbd3e7;background:#f4f5fb;border-radius:6px;cursor:pointer}.notice{font-weight:600;color:#1c2eab;margin-top:12px}.modal{border:0;border-radius:16px;padding:22px;width:min(420px,calc(100% - 32px));box-shadow:0 15px 50px #0005}.modal::backdrop{background:#0008}.modal menu{padding:0;display:flex;justify-content:flex-end;gap:10px}.modal .btn{font-size:.95rem}.people{max-height:280px;overflow:auto;border:1px solid #cbd3e7;border-radius:8px}.person{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #eee}.person input{width:auto}.muted{color:#687187;font-size:.9rem}@media(max-width:650px){.panel{padding:15px}.template-line{gap:5px}.icon-btn{width:34px;height:34px;flex-basis:34px}}</style></head><body class="dashboard-page"><header class="dashboard-header"><div class="subpage-header-inner"><a class="back-button" href="admin.html">← Accueil ADMIN</a><a class="dashboard-title" href="dashboard.html" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a><button id="logout-button" class="logout-button">Se déconnecter</button></div></header><main class="main"><section class="panel"><h1>WhatsApp</h1>
<div class="field"><div class="template-line"><select id="templates" aria-label="Template"><option value="">Nouveau template</option></select><button id="new" class="icon-btn add" title="Nouveau template" aria-label="Nouveau template">+</button><button id="copy" class="icon-btn" title="Copier le template" aria-label="Copier le template">⧉</button><button id="delete" class="icon-btn delete" title="Supprimer le template" aria-label="Supprimer le template">×</button></div></div>
<div class="field"><label for="name">Nom</label><input id="name"></div>
<div class="field"><label for="date">Date</label><input id="date" type="date"></div>
<div class="field"><label for="body">Contenu</label><textarea id="body" rows="9"></textarea><div class="toolbar"><button data-insert="*">B</button><button data-insert="_"><i>I</i></button><button data-value="{prenom}">{prenom}</button><button data-value="{nom}">{nom}</button><button data-value="{email}">{email}</button><button data-value="{poste}">{poste}</button></div></div>
<h2 style="color:#1c2eab">Aperçu</h2><div class="preview"><div id="preview" class="bubble"></div></div>
<div class="actions" style="margin-top:20px"><button id="save" class="btn">Enregistrer</button><button id="test" class="btn purple">Envoyer un test</button><button id="campaign" class="btn red">Créer les envois</button></div><div id="notice" class="notice" role="status"></div></section></main>
<dialog id="test-modal" class="modal"><h2>Envoyer un test WhatsApp</h2><label for="test-phone">Numéro de téléphone</label><input id="test-phone" type="tel" inputmode="tel" placeholder="0400 00 00 00"><menu><button id="test-cancel" class="btn" type="button">Annuler</button><button id="test-send" class="btn purple" type="button">Ouvrir WhatsApp</button></menu></dialog>
<dialog id="recipients-modal" class="modal" style="width:min(660px,calc(100% - 32px))"><h2>Créer les envois</h2><p>Sélectionne les destinataires du message.</p><input id="search-person" placeholder="Rechercher un prénom ou NOM" type="search"><div style="margin:8px 0"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="all-people" style="width:auto"> Sélectionner toutes les personnes joignables</label></div><div id="people" class="people">Chargement…</div><p id="selection" class="muted"></p><menu><button id="recipient-cancel" class="btn" type="button">Annuler</button><button id="create-campaign" class="btn red" type="button">Créer les envois</button></menu></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script><script>(async()=>{document.getElementById('logout-button').onclick=()=>PortalAuth.logout();const user=await PortalAuth.requireAuth();if(!user)return;const {data:isAdmin,error:accessError}=await PortalAuth.client.rpc('is_current_portal_admin');if(accessError||!isAdmin){document.querySelector('main').textContent='Accès réservé aux administrateurs.';return;}const db=PortalAuth.client;
const $=id=>document.getElementById(id),notice=t=>{$('notice').textContent=t},today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Brussels'});
let templates=[],current=null,people=[],selected=new Set();
$('date').value=today();
function fresh(){current=null;$('templates').value='';$('name').value='';$('date').value=today();$('body').value='';preview()}
function read(){return {name:$('name').value.trim(),template_date:$('date').value,body:$('body').value}}
function preview(){$('preview').textContent=$('body').value||'Le message apparaîtra ici.'}
$('body').addEventListener('input',preview);
document.querySelectorAll('[data-insert],[data-value]').forEach(btn=>btn.addEventListener('click',()=>{const ta=$('body'),a=ta.selectionStart,b=ta.selectionEnd,selected=ta.value.slice(a,b),insert=btn.dataset.value||btn.dataset.insert+selected+btn.dataset.insert;ta.setRangeText(insert,a,b,'select');ta.focus();preview()}));
async function loadTemplates(){const {data,error}=await db.from('whatsapp_message_templates').select('*').order('created_at',{ascending:false});if(error)throw error;templates=data||[];$('templates').replaceChildren(new Option('Nouveau template',''));for(const t of templates)$('templates').add(new Option(t.name+' – '+new Date(t.template_date+'T12:00').toLocaleDateString('fr-BE'),t.id))}
$('templates').onchange=()=>{current=templates.find(t=>t.id===$('templates').value)||null;if(current){$('name').value=current.name;$('date').value=current.template_date;$('body').value=current.body;}else fresh();preview()};
$('new').onclick=fresh;
$('copy').onclick=()=>{if(!current)return notice('Sélectionne un template à copier.');$('name').value+=' – Copie';current=null;$('templates').value='';notice('Copie indépendante : clique sur Enregistrer.')};
$('delete').onclick=async()=>{if(!current)return;if(!confirm('Supprimer ce template ? Les campagnes déjà créées seront conservées.'))return;const {error}=await db.from('whatsapp_message_templates').delete().eq('id',current.id);if(error)return notice(error.message);await loadTemplates();fresh();notice('Template supprimé.')};
async function save(){const data=read();if(!data.name||!data.template_date||!data.body.trim())throw Error('Renseigne le nom, la date et le contenu.');const payload={...data,updated_at:new Date().toISOString()};const q=current?db.from('whatsapp_message_templates').update(payload).eq('id',current.id):db.from('whatsapp_message_templates').insert(payload);const {data:items,error}=await q.select('*').single();if(error)throw error;current=items;await loadTemplates();$('templates').value=current.id;notice('Template enregistré.');return items}
$('save').onclick=async()=>{try{await save()}catch(e){notice(e.message)}};
const phoneDigits=s=>String(s||'').replace(/\D/g,'');const phoneValid=s=>/^04\d{8}$/.test(phoneDigits(s));const international=s=>'32'+phoneDigits(s).slice(1);
function messageFor(r){return read().body.replace(/\{(prenom|nom|email|poste)\}/gi,(m,k)=>String(r[k.toLowerCase()]||''))}
$('test').onclick=()=>{$('test-modal').showModal()};
$('test-cancel').onclick=()=>$('test-modal').close();
$('test-phone').oninput=e=>{let d=phoneDigits(e.target.value).slice(0,10);e.target.value=[d.slice(0,4),d.slice(4,6),d.slice(6,8),d.slice(8)].filter(Boolean).join(' ')};
$('test-send').onclick=()=>{const n=$('test-phone').value;if(!phoneValid(n)){alert('Saisis un numéro GSM belge valide.');return}const url='https://wa.me/'+international(n)+'?text='+encodeURIComponent(messageFor({prenom:'{prenom}',nom:'{nom}',email:'{email}',poste:'{poste}'}));window.open(url,'_blank','noopener');$('test-modal').close()};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function drawPeople(){const filter=norm($('search-person').value);const wrap=$('people');wrap.replaceChildren();let count=0;for(const p of people){if(!norm(p.prenom+' '+p.nom).includes(filter))continue;const row=document.createElement('label');row.className='person';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(p.id);check.disabled=!phoneValid(p.telephone);check.onchange=()=>{if(check.checked)selected.add(p.id);else selected.delete(p.id);$('selection').textContent=selected.size+' destinataire(s) sélectionné(s).'};row.append(check,document.createTextNode(p.prenom+' '+p.nom+(check.disabled?' — GSM indisponible':'')));wrap.append(row);count++;}if(!count)wrap.textContent='Aucun destinataire trouvé.';$('selection').textContent=selected.size+' destinataire(s) sélectionné(s).'}
$('search-person').oninput=drawPeople;
$('all-people').onchange=e=>{selected=new Set(e.target.checked?people.filter(p=>phoneValid(p.telephone)).map(p=>p.id):[]);drawPeople()};
$('campaign').onclick=async()=>{try{if(!read().name||!read().body.trim())throw Error('Complète le nom et le contenu avant de créer les envois.');await save();$('recipients-modal').showModal();const {data,error}=await db.rpc('admin_list_benevoles');if(error)throw error;people=(data||[]).filter(x=>!/^(guide|patro|pionnier)\s*0*\d+$/i.test(x.prenom||'')).map(x=>({id:String(x.id||x.benevole_id||x.personne_id),prenom:x.prenom||'',nom:x.nom||'',email:x.email||'',telephone:x.telephone||x.gsm||''})).filter(x=>x.id);selected.clear();$('all-people').checked=false;drawPeople()}catch(e){notice(e.message)}};
$('recipient-cancel').onclick=()=>$('recipients-modal').close();
$('create-campaign').onclick=async()=>{if(!selected.size)return alert('Sélectionne au moins un destinataire joignable.');const btn=$('create-campaign');btn.disabled=true;try{const t=await save();const {data:c,error:ce}=await db.from('whatsapp_message_campaigns').insert({template_id:t.id,name:t.name,template_date:t.template_date,body:t.body}).select('id').single();if(ce)throw ce;const chosen=people.filter(p=>selected.has(p.id)).map(p=>({campaign_id:c.id,benevole_id:p.id,prenom:p.prenom,nom:p.nom,email:p.email,telephone:p.telephone}));const {error:re}=await db.from('whatsapp_message_recipients').insert(chosen);if(re)throw re;window.location.href='admin-communications-whatsapp-suivi.html?id='+encodeURIComponent(c.id)}catch(e){notice(e.message);btn.disabled=false}};
try{await loadTemplates();preview()}catch(e){notice('Erreur de chargement : '+e.message)}
})();</script></body></html>
