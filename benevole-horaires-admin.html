<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Horaires du bénévole — Administration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20260921-2">
  <link rel="stylesheet" href="subpage-header.css?v=20260922-2">
  <link rel="stylesheet" href="presence.css?v=20260922-4">
  <link rel="stylesheet" href="horaires.css?v=20260923-1">
  <link rel="stylesheet" href="benevole-horaires-admin.css?v=20260923-6">
  <link rel="stylesheet" href="benevole-horaires-admin-add.css?v=20260927-7">
  <link rel="stylesheet" href="benevole-horaires-admin-total.css?v=20260925-5">
  <link rel="stylesheet" href="phone-actions.css?v=20260922-1">
  <link rel="stylesheet" href="print-icon-button.css?v=20260924-1">
  <style>
    .schedule-heading-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
    .schedule-mail-control{display:flex;align-items:center;gap:8px}
    .schedule-mail-button{border:0;border-radius:10px;background:#1C2EAB;color:#fff;font-family:"Titillium Web",sans-serif;font-weight:700;padding:10px 14px;cursor:pointer}
    .schedule-mail-button:disabled{opacity:.6;cursor:default}
    .schedule-mail-status{font-size:.9rem;font-weight:600}
    .schedule-mail-status.sent{color:#168344}
    .schedule-mail-sent-dot{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;min-width:27px;border-radius:50%;background:#168344;color:#fff;font-size:18px;font-weight:700;line-height:1;cursor:help}.schedule-mail-status.pending{color:#1C2EAB}.schedule-mail-status.error{color:#E40230}
    @media(max-width:700px){.volunteer-schedule-heading{align-items:flex-start}.schedule-heading-actions{flex-direction:column-reverse;align-items:flex-end}.schedule-mail-control{flex-direction:column;align-items:flex-end}.schedule-mail-button{max-width:180px}}
  </style>
</head>
<body class="dashboard-page">

  <header class="dashboard-header">
    <div class="subpage-header-inner">
      <a href="benevoles-liste.html" class="back-button">← Liste des bénévoles</a>
      <a href="dashboard.html" class="dashboard-title" style="color:#fff;text-decoration:none">🎪 PORTAIL BÉNÉVOLES 🎪</a>
      <button type="button" id="logout-button" class="logout-button">Se déconnecter</button>
    </div>
  </header>

  <main class="subpage-main">
    <section class="subpage-heading volunteer-schedule-heading">
      <div class="schedule-volunteer-identity">
        <button
          type="button"
          id="schedule-add-button"
          class="schedule-add-button"
          aria-label="Ajouter un nouvel horaire"
          title="Ajouter un nouvel horaire"
          aria-expanded="false"
          aria-controls="schedule-add-panel"
        >+</button>

        <h1 id="volunteer-schedule-title">Bénévole</h1>
        <div class="schedule-bulk-control">
          <button type="button" id="schedule-bulk-status" class="schedule-presence-dot schedule-presence-inconnu"
            aria-label="Statut de présence du bénévole. Modifier pour tous les horaires à venir."
            aria-expanded="false" aria-haspopup="true" disabled></button>
          <div id="schedule-bulk-menu" class="schedule-presence-menu schedule-bulk-menu" hidden>
            <button type="button" id="schedule-bulk-absent">
              <span class="schedule-presence-swatch schedule-presence-absent" aria-hidden="true"></span>
              <span>Absent·e pour tous les horaires à venir</span>
            </button>
          </div>
        </div>
        <span id="schedule-total-hours" class="schedule-total-hours" hidden></span>
      </div>

      <div class="schedule-heading-actions">
        <div class="schedule-mail-control">
          <button type="button" id="mail-volunteer-schedule-button" class="schedule-mail-button" hidden>Envoyer l’horaire par mail</button>
          <span id="mail-volunteer-schedule-status" class="schedule-mail-status" hidden></span>
        </div>
      <button
        type="button"
        id="print-volunteer-label-button"
        class="schedule-print-button"
        aria-label="Imprimer l'étiquette de ce bénévole"
        title="Imprimer l'étiquette"
      >
        🖨️
      </button>
      </div>
    </section>

    <p id="schedule-bulk-message" class="schedule-bulk-message" role="alert" hidden></p>

    <div id="schedule-add-panel" class="schedule-add-panel" hidden></div>

    <section class="schedule-section">
      <div id="schedule-loading" class="contacts-message">Chargement du planning...</div>
      <div id="schedule-empty" class="contacts-message" hidden>Aucun horaire disponible pour ce bénévole.</div>
      <div id="schedule-error" class="contacts-message contacts-error" hidden>Impossible de charger ce planning.</div>
      <div id="schedule-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal-auth.js"></script>
  <script src="benevole-horaires-admin.js?v=20260928-2"></script>
  <script src="festival-day-schedule.js?v=20260926-1"></script>
  <script src="benevole-horaires-admin-slots.js?v=20260923-2"></script>
  <script src="benevole-horaires-admin-cancel.js?v=20260923-1"></script>
  <script src="benevole-horaires-lieux.js?v=20260926-2"></script>
  <script src="benevole-horaires-admin-add.js?v=20260926-2"></script>
  <script src="benevole-horaires-admin-total.js?v=20260925-2"></script>
</body>
</html>
